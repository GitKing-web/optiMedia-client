[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for client-side routes.
# Existing static files (including hashed /assets/*) are served first by Netlify,
# so real assets are never shadowed by this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the HTML shell, so users always get the latest asset hashes.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets are immutable and safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
